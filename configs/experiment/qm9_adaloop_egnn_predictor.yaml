# @package _global_
defaults:
  - qm9_loop_egnn
  - _self_

model:
  execution:
    name: adaptive
    depth: 24
    inference_rule: cdf
    threshold: 0.5
  halting:
    hidden_dim: 64
    use_delta: true
task:
  name: adaptive_regression
  supervision: adaptive
  normalization: mad
  phase: predictor
  entropy_beta: 0.01
  halting_loss: expected
  soft_cdf_temperature: 0.1
trainer:
  epochs: 1000
experiment_name: qm9_${task.target}_adaloop_${task.phase}_k${model.execution.depth}_s${seed}
