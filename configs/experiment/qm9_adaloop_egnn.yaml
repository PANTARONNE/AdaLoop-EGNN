# @package _global_
defaults:
  - qm9_loop_egnn
  - _self_

model:
  execution:
    name: adaptive
    depth: 24
    inference_rule: cdf
    threshold: 0.5
  halting:
    hidden_dim: 64
    use_delta: true
task:
  name: adaptive_regression
  supervision: adaptive
  normalization: mad
  # Explicit boundary remains unchanged on resume. Override with shorter training.
  warmup_epochs: 300
experiment_name: qm9_${task.target}_adaloop_k${model.execution.depth}_s${seed}
