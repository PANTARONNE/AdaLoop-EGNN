[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqcompute"
version = "0.1.0"
description = "Iterative equivariant molecular learning: Experiment 0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3,<2.9",
  "torch-geometric==2.7.0",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "numpy>=1.26,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a locally downloaded QM9 dataset"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
